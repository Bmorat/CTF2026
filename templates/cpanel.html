<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel T.E.R.O. · Acceso</title>
  <style>
    :root {
      --bg: #080809;
      --card: #151211;
      --text: #f4ead8;
      --muted: #a99c88;
      --accent: #f0c36a;
      --danger: #ff6b57;
      --border: rgba(151, 61, 51, .62);
    }
    * { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 12%, rgba(151, 61, 51, .28), transparent 28rem),
        linear-gradient(180deg, #0b0b0d, #070707);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Inter, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, rgba(24, 22, 20, .95), rgba(10, 10, 11, .98));
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }
    .card h1 { margin: 0 0 8px; font-size: 1.4rem }
    .card p { margin: 0 0 16px; color: var(--muted); font-size: .95rem }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 4px;
      background: #6f1d17; display: grid; place-items: center; font-weight: 700; color: #f0c36a
    }
    .field { margin-bottom: 12px }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: .9rem }
    input[type=text], input[type=password] {
      width: 100%; padding: 12px 12px; background: #09090b; border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); outline: none
    }
    input::placeholder { color: #64748b }
    input:focus { border-color: var(--accent) }
    .input-wrap { position: relative }
    .toggle-pass { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 1rem }
    .row { display: flex; align-items: center; gap: 8px }
    .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between }
    button, input[type=submit] {
      appearance: none; border: none; background: var(--accent); color: #140b09;
      font-weight: 700; padding: 12px 14px; border-radius: 4px; cursor: pointer
    }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border) }
    .status { margin-top: 12px; min-height: 20px; color: var(--muted); font-size: .85rem }
    .status.error { color: var(--danger) }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="titulo">
    <div class="brand">
      <div class="logo">TR</div>
      <div>
        <h1 id="titulo">Panel T.E.R.O.</h1>
        <p>Ingresá con tu operador y clave de campo.</p>
      </div>
    </div>

    <form id="login" method="POST" action="/cpanel" novalidate>
      <div class="field">
        <label for="usuario">Operador</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" required placeholder="operador.rural" />
      </div>

      <div class="field">
        <label for="contrasena">Clave de bandada</label>
        <div class="input-wrap">
          <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required placeholder="••••••••" />
          <button type="button" class="toggle-pass" aria-label="Mostrar u ocultar contraseña">👁</button>
        </div>
      </div>

      <div class="actions">
        <label class="row" style="font-size:.85rem">
          <input type="checkbox" id="keep" name="keep" value="1" />
          Mantener señal
        </label>
        <input id="submitBtn" type="submit" value="Acceder" />
      </div>

      {% if mensaje %}
      <div class="status error" role="alert">{{ mensaje }}</div>
      {% endif %}
      <div class="status" id="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const passInput = document.getElementById('contrasena');
    const toggleBtn = document.querySelector('.toggle-pass');
    toggleBtn.addEventListener('click', () => {
      const isPwd = passInput.type === 'password';
      passInput.type = isPwd ? 'text' : 'password';
      toggleBtn.textContent = isPwd ? '🙈' : '👁';
    });
  </script>
</body>
</html>
