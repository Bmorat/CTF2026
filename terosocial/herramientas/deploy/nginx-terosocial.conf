# =====================================================================
#  TeroSocial - configuracion de nginx (servidor Debian, publico)
#
#  Copiar a:  /etc/nginx/sites-available/terosocial
#  Cambiar:   server_name  -> tu dominio (o "_" si todavia no tenes)
#
#  OJO: la raiz apunta a la SUBCARPETA entrega/, no al repo entero.
#  entrega/ es la copia sin diagnostico.html ni herramientas internas.
# =====================================================================

server {
    # Puerto elegido para el ejercicio: http://IP:8347/
    #
    # No es el 80 porque esa maquina esta compartida y ya tiene varios
    # servicios arriba (5001, 5173, 5433, 5601, 8443, 9200 y los efimeros
    # de Docker). Tampoco es 8080 ni 8000: demasiado genericos.
    #
    # Con un puerto no estandar la direccion tiene que llevarlo escrito
    # siempre, el navegador no lo agrega solo.
    #
    # OJO al cambiarlo: los navegadores se niegan a conectarse a ciertos
    # puertos aunque el servidor responda bien (ERR_UNSAFE_PORT). Entre
    # ellos 6000, 6665-6669, 10080, 4045, 2049, 5060, 1719 y 1720. El
    # sitio anda con curl desde el server y no abre en ninguna maquina.
    listen 8347;
    listen [::]:8347;

    # Cambiar por tu dominio, ej: server_name terosocial.midominio.uy;
    # Con "_" responde a cualquier nombre/IP (sirve para probar).
    server_name _;

    # La raiz es la carpeta entrega/ DENTRO del repo clonado. Ojo con el
    # nivel TeroSocial/: el repositorio guarda el proyecto en una
    # subcarpeta, asi que la ruta lleva ese nombre en el medio. Si esto
    # apunta mal, nginx responde 404 en todo el sitio.
    root /var/www/terosocial/TeroSocial/entrega;
    index index.html;

    charset utf-8;

    # No anunciar la version de nginx (servidor publico).
    server_tokens off;

    # ---- Pagina de error propia ----
    # entrega/404.html es parte del decorado de la plataforma. Sin esta
    # linea nginx muestra su propio 404 y se rompe la ilusion justo
    # cuando el participante anda probando direcciones a mano, que es
    # exactamente lo que el ejercicio 3 le pide hacer.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- Listado de directorio ----
    # El ejercicio 3 necesita que se pueda ver el contenido de estas
    # carpetas (no tienen index.html). Sin autoindex, nginx da 403.
    location /respaldo/ { autoindex on; autoindex_exact_size off; autoindex_localtime on; }
    location /api/      { autoindex on; }
    location /_dev/     { autoindex on; }

    # ---- Compresion: SOLO texto ----
    # Las imagenes NO se tocan: cualquier recompresion borra los
    # metadatos EXIF y ahi se cae el ejercicio 2.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
