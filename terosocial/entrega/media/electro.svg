<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>Apple</Make>
      <Model>iPhone SE (3rd generation)</Model>
      <Software>17.2</Software>
      <DateTimeOriginal>2026:04:02 19:47:33</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/60</ExposureTime>
      <FNumber>1.8</FNumber>
      <ISOSpeedRatings>500</ISOSpeedRatings>
      <FocalLength>3.99 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Televisor viejo y radio a transistores</title>
  <desc>Ilustracion plana de un televisor de tubo antiguo con antena y una radio a transistores apoyados sobre una mesa de madera contra una pared clara.</desc>

  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ecdcbe"/>
      <stop offset="70%"  stop-color="#d9bf98"/>
      <stop offset="100%" stop-color="#c3a67c"/>
    </linearGradient>
    <linearGradient id="mesae" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a9743a"/>
      <stop offset="50%"  stop-color="#8b5a28"/>
      <stop offset="100%" stop-color="#6b431b"/>
    </linearGradient>
    <linearGradient id="gabinete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c08b4e"/>
      <stop offset="55%"  stop-color="#9a6733"/>
      <stop offset="100%" stop-color="#734b22"/>
    </linearGradient>
    <radialGradient id="pantalla" cx="42%" cy="32%" r="70%">
      <stop offset="0%"   stop-color="#8fb6c4"/>
      <stop offset="55%"  stop-color="#4f7284"/>
      <stop offset="100%" stop-color="#263a47"/>
    </radialGradient>
    <radialGradient id="luzp" cx="25%" cy="15%" r="70%">
      <stop offset="0%"   stop-color="#fff6e0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fff6e0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="500" fill="url(#parede)"/>
  <rect width="900" height="500" fill="url(#luzp)"/>
  <rect x="0" y="332" width="900" height="10" fill="#bda07a" opacity="0.8"/>

  <!-- mesa -->
  <rect x="0" y="342" width="900" height="158" fill="url(#mesae)"/>
  <rect x="0" y="342" width="900" height="12" fill="#c1884a"/>
  <g stroke="#5e3a15" stroke-width="4" opacity="0.5">
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="452" x2="900" y2="452"/>
  </g>

  <!-- antena de conejo -->
  <g stroke="#b0b6bc" stroke-width="9" stroke-linecap="round">
    <line x1="286" y1="126" x2="200" y2="30"/>
    <line x1="306" y1="126" x2="404" y2="42"/>
  </g>
  <g fill="#8d949b">
    <circle cx="200" cy="30" r="10"/>
    <circle cx="404" cy="42" r="10"/>
  </g>
  <rect x="272" y="116" width="48" height="22" rx="8" fill="#5c5852"/>

  <!-- televisor -->
  <g>
    <ellipse cx="300" cy="356" rx="192" ry="20" fill="#000" opacity="0.24"/>
    <rect x="112" y="132" width="380" height="222" rx="18" fill="url(#gabinete)"/>
    <rect x="112" y="132" width="380" height="222" rx="18" fill="none" stroke="#5e3c19" stroke-width="6"/>
    <!-- pantalla -->
    <rect x="140" y="158" width="252" height="172" rx="34" fill="#22201d"/>
    <rect x="150" y="168" width="232" height="152" rx="28" fill="url(#pantalla)"/>
    <path d="M162 178 q60 -6 96 12 q-70 26 -96 66 z" fill="#ffffff" opacity="0.18"/>
    <g stroke="#d7e4ea" stroke-width="4" opacity="0.25">
      <line x1="152" y1="200" x2="380" y2="200"/>
      <line x1="152" y1="240" x2="380" y2="240"/>
      <line x1="152" y1="280" x2="380" y2="280"/>
    </g>
    <!-- panel de controles -->
    <rect x="404" y="158" width="72" height="172" rx="10" fill="#7d5226"/>
    <circle cx="440" cy="196" r="22" fill="#3e3a35"/>
    <circle cx="440" cy="196" r="10" fill="#c9a24a"/>
    <circle cx="440" cy="252" r="18" fill="#3e3a35"/>
    <circle cx="440" cy="252" r="8"  fill="#c9a24a"/>
    <g fill="#5c5852">
      <rect x="420" y="286" width="40" height="9" rx="4"/>
      <rect x="420" y="302" width="40" height="9" rx="4"/>
    </g>
    <!-- patas -->
    <g fill="#4a3418">
      <rect x="148" y="352" width="26" height="18" rx="6"/>
      <rect x="430" y="352" width="26" height="18" rx="6"/>
    </g>
  </g>

  <!-- radio a transistores -->
  <g transform="translate(586,208)">
    <ellipse cx="132" cy="152" rx="150" ry="18" fill="#000" opacity="0.22"/>
    <rect x="0" y="12" width="264" height="134" rx="16" fill="#b5763c"/>
    <rect x="0" y="12" width="264" height="134" rx="16" fill="none" stroke="#7a4b1e" stroke-width="6"/>
    <!-- parlante -->
    <rect x="18" y="32" width="120" height="96" rx="10" fill="#e6d9bd"/>
    <g fill="#a89574">
      <rect x="28" y="44"  width="100" height="8" rx="4"/>
      <rect x="28" y="60"  width="100" height="8" rx="4"/>
      <rect x="28" y="76"  width="100" height="8" rx="4"/>
      <rect x="28" y="92"  width="100" height="8" rx="4"/>
      <rect x="28" y="108" width="100" height="8" rx="4"/>
    </g>
    <!-- dial -->
    <rect x="152" y="32" width="94" height="46" rx="8" fill="#f0e5cb"/>
    <g stroke="#8a7c5e" stroke-width="4">
      <line x1="164" y1="40" x2="164" y2="70"/>
      <line x1="182" y1="46" x2="182" y2="70"/>
      <line x1="200" y1="40" x2="200" y2="70"/>
      <line x1="218" y1="46" x2="218" y2="70"/>
      <line x1="236" y1="40" x2="236" y2="70"/>
    </g>
    <rect x="192" y="30" width="7" height="52" rx="3" fill="#c04a2c"/>
    <!-- perillas -->
    <circle cx="176" cy="112" r="20" fill="#3e3a35"/>
    <circle cx="176" cy="112" r="9"  fill="#d8b45c"/>
    <circle cx="224" cy="112" r="16" fill="#3e3a35"/>
    <circle cx="224" cy="112" r="7"  fill="#d8b45c"/>
    <!-- manija y antena -->
    <path d="M60 12 q70 -46 146 0" stroke="#6b431b" stroke-width="9" fill="none"/>
    <line x1="248" y1="14" x2="290" y2="-62" stroke="#a9b0b6" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- carpeta tejida bajo la radio -->
  <g opacity="0.6">
    <ellipse cx="718" cy="362" rx="168" ry="22" fill="#e4d6b8"/>
    <ellipse cx="718" cy="362" rx="140" ry="16" fill="#f0e5cb"/>
  </g>

</svg>
