<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>Canon</Make>
      <Model>Canon EOS 250D</Model>
      <Software>Digital Photo Professional</Software>
      <DateTimeOriginal>2026:06:21 09:48:15</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/800</ExposureTime>
      <FNumber>5.6</FNumber>
      <ISOSpeedRatings>200</ISOSpeedRatings>
      <FocalLength>200 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Hornero sobre poste de alambrado</title>
  <desc>Ilustracion plana de un hornero parado junto a su nido de barro sobre un poste de alambrado, con campo abierto y cielo despejado de fondo.</desc>

  <defs>
    <linearGradient id="cieloc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6fa8d6"/>
      <stop offset="55%"  stop-color="#bcd8e8"/>
      <stop offset="100%" stop-color="#eae2cf"/>
    </linearGradient>
    <linearGradient id="campo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a8b268"/>
      <stop offset="45%"  stop-color="#8ca055"/>
      <stop offset="100%" stop-color="#6f8642"/>
    </linearGradient>
    <linearGradient id="barro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#c08a55"/>
      <stop offset="100%" stop-color="#8d5c30"/>
    </linearGradient>
    <linearGradient id="posteg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7d6248"/>
      <stop offset="40%"  stop-color="#9c7c5c"/>
      <stop offset="100%" stop-color="#634c36"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#cieloc)"/>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="180" cy="88"  rx="104" ry="18"/>
    <ellipse cx="248" cy="74"  rx="62"  ry="13"/>
    <ellipse cx="700" cy="120" rx="118" ry="16"/>
    <ellipse cx="640" cy="106" rx="60"  ry="11"/>
  </g>

  <!-- campo -->
  <rect x="0" y="300" width="900" height="200" fill="url(#campo)"/>
  <path d="M0 300 q160 -26 340 -6 q200 22 560 -4 l0 24 L0 324 Z" fill="#7d9450"/>
  <g fill="#5f7a3c" opacity="0.6">
    <ellipse cx="120" cy="356" rx="90" ry="16"/>
    <ellipse cx="520" cy="392" rx="150" ry="20"/>
    <ellipse cx="820" cy="352" rx="90" ry="14"/>
  </g>
  <g fill="#4c6a34">
    <ellipse cx="96"  cy="292" rx="40" ry="26"/>
    <ellipse cx="140" cy="296" rx="28" ry="18"/>
    <ellipse cx="792" cy="290" rx="46" ry="28"/>
  </g>

  <!-- postes lejanos con alambre -->
  <g stroke="#6b543c" stroke-width="6">
    <line x1="80"  y1="312" x2="80"  y2="368"/>
    <line x1="230" y1="308" x2="230" y2="360"/>
    <line x1="820" y1="310" x2="820" y2="362"/>
  </g>
  <g stroke="#7b6a52" stroke-width="3" opacity="0.9">
    <path d="M0 330 q160 10 300 6"/>
    <path d="M0 348 q160 12 300 8"/>
    <path d="M660 336 q120 -8 240 -4"/>
    <path d="M660 354 q120 -8 240 -4"/>
  </g>

  <!-- poste principal -->
  <ellipse cx="470" cy="470" rx="90" ry="20" fill="#000" opacity="0.16"/>
  <rect x="432" y="196" width="66" height="278" rx="8" fill="url(#posteg)"/>
  <g stroke="#5b4632" stroke-width="4" opacity="0.7">
    <line x1="450" y1="210" x2="450" y2="464"/>
    <line x1="480" y1="220" x2="480" y2="458"/>
  </g>
  <rect x="426" y="188" width="78" height="16" rx="6" fill="#a9886a"/>

  <!-- alambres que salen del poste -->
  <g stroke="#8a7861" stroke-width="4">
    <path d="M498 262 q200 14 402 4"/>
    <path d="M498 314 q200 16 402 6"/>
    <path d="M0 258 q220 22 432 12"/>
    <path d="M0 310 q220 24 432 14"/>
  </g>

  <!-- nido de barro -->
  <g transform="translate(560,188)">
    <ellipse cx="0" cy="106" rx="96" ry="16" fill="#000" opacity="0.14"/>
    <path d="M-92 104 q-6 -112 92 -112 q98 0 92 112 z" fill="url(#barro)"/>
    <path d="M-92 104 q-6 -112 92 -112 q22 0 40 8 q-72 24 -66 104 z" fill="#d09a63" opacity="0.5"/>
    <path d="M18 104 q-4 -56 34 -58 q34 -2 36 58 z" fill="#5e3c1f"/>
    <g stroke="#7a4f28" stroke-width="3" opacity="0.55" fill="none">
      <path d="M-74 62 q34 -14 62 -6"/>
      <path d="M-64 26 q34 -18 66 -10"/>
      <path d="M-40 -2 q28 -16 58 -12"/>
    </g>
    <rect x="-96" y="98" width="192" height="14" rx="7" fill="#7d5029"/>
  </g>

  <!-- hornero -->
  <g transform="translate(414,152)">
    <path d="M-6 40 q-52 -6 -58 -44 q-4 -34 24 -46 q30 -12 48 12 q18 26 4 60 z" fill="#b4703c"/>
    <path d="M-10 36 q-34 -6 -40 -34 q-4 -22 16 -32 q6 30 24 66 z" fill="#d99a63"/>
    <path d="M-46 -22 q-16 -26 6 -40 q22 -14 40 4 q16 18 2 38 z" fill="#c07f47"/>
    <circle cx="-14" cy="-42" r="6" fill="#231a12"/>
    <path d="M-42 -38 l-30 8 28 8 z" fill="#4a3625"/>
    <path d="M-6 -56 q22 -6 34 8 q-20 2 -34 -8 z" fill="#a8663a"/>
    <path d="M6 22 q34 8 46 32 q-30 -6 -50 -18 z" fill="#8f5528"/>
    <g stroke="#5a4128" stroke-width="5" stroke-linecap="round">
      <line x1="-16" y1="38" x2="-18" y2="56"/>
      <line x1="4"   y1="36" x2="6"   y2="56"/>
    </g>
    <g stroke="#5a4128" stroke-width="4" stroke-linecap="round">
      <line x1="-18" y1="56" x2="-30" y2="60"/>
      <line x1="6"   y1="56" x2="-6"  y2="60"/>
    </g>
  </g>

</svg>
