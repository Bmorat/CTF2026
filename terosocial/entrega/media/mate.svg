<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>Xiaomi</Make>
      <Model>Redmi Note 12</Model>
      <Software>MIUI Camara 5.1.0</Software>
      <DateTimeOriginal>2026:04:18 08:12:44</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/60</ExposureTime>
      <FNumber>1.8</FNumber>
      <ISOSpeedRatings>200</ISOSpeedRatings>
      <FocalLength>5.59 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Mate y termo sobre la mesa</title>
  <desc>Ilustracion plana de un mate de calabaza con bombilla y un termo verde apoyados sobre una mesa de madera, con un plato de bizcochos al costado.</desc>

  <defs>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2e2c6"/>
      <stop offset="70%"  stop-color="#e0c6a0"/>
      <stop offset="100%" stop-color="#cfae86"/>
    </linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b0762f"/>
      <stop offset="55%"  stop-color="#96601f"/>
      <stop offset="100%" stop-color="#7a4b17"/>
    </linearGradient>
    <linearGradient id="porongo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5a3619"/>
      <stop offset="45%"  stop-color="#8f5a2c"/>
      <stop offset="100%" stop-color="#4d2d13"/>
    </linearGradient>
    <linearGradient id="termo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1c5240"/>
      <stop offset="42%"  stop-color="#348062"/>
      <stop offset="100%" stop-color="#173f31"/>
    </linearGradient>
    <radialGradient id="luzpared" cx="30%" cy="20%" r="70%">
      <stop offset="0%"   stop-color="#fff6e2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff6e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="500" fill="url(#pared)"/>
  <rect width="900" height="500" fill="url(#luzpared)"/>

  <!-- mesa -->
  <rect x="0" y="248" width="900" height="252" fill="url(#madera)"/>
  <rect x="0" y="248" width="900" height="12" fill="#c58c46"/>
  <g stroke="#6d4211" stroke-width="3" opacity="0.45">
    <line x1="0" y1="302" x2="900" y2="302"/>
    <line x1="0" y1="356" x2="900" y2="356"/>
    <line x1="0" y1="412" x2="900" y2="412"/>
    <line x1="0" y1="466" x2="900" y2="466"/>
  </g>

  <!-- plato con bizcochos -->
  <g transform="translate(180,392)">
    <ellipse cx="0" cy="16" rx="118" ry="30" fill="#000" opacity="0.16"/>
    <ellipse cx="0" cy="8"  rx="115" ry="30" fill="#e6ded0"/>
    <ellipse cx="0" cy="2"  rx="94"  ry="24" fill="#f3ece1"/>
    <g fill="#d79646" stroke="#a86c2b" stroke-width="3">
      <path d="M-72 -4 q28 -34 62 -6 q-30 -6 -62 6 z"/>
      <path d="M-16 6 q30 -36 66 -8 q-32 -6 -66 8 z"/>
      <path d="M-52 20 q32 -30 68 -4 q-34 -4 -68 4 z"/>
