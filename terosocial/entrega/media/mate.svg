    <g fill="#f0c377" opacity="0.75">
      <path d="M-64 -6 q22 -22 46 -6 q-24 -2 -46 6 z"/>
      <path d="M-8 4 q24 -24 50 -8 q-26 -2 -50 8 z"/>
    </g>
  </g>

  <!-- mate con bombilla -->
  <g transform="translate(400,286)">
    <ellipse cx="0" cy="120" rx="76" ry="20" fill="#000" opacity="0.18"/>
    <path d="M-56 14 q56 -26 112 0 l-16 88 q-40 22 -80 0 z" fill="url(#porongo)"/>
    <path d="M-34 30 q10 60 6 74 q-14 -8 -18 -70 z" fill="#c08a51" opacity="0.35"/>
    <ellipse cx="0" cy="14" rx="56" ry="16" fill="#3f2411"/>
    <ellipse cx="0" cy="12" rx="43" ry="12" fill="#8d9c46"/>
    <path d="M-40 12 q22 -22 46 -12 q-24 10 -46 12 z" fill="#a8b45c"/>
    <path d="M14 8 q20 4 26 10 q-24 6 -34 -2 z" fill="#6f7d35"/>
    <ellipse cx="0" cy="104" rx="40" ry="12" fill="#33200f"/>
    <g transform="rotate(16 22 0)">
      <rect x="16" y="-96" width="11" height="110" rx="5" fill="#c4c9cf"/>
      <rect x="16" y="-96" width="4"  height="110" fill="#eef1f4" opacity="0.7"/>
      <ellipse cx="21" cy="-98" rx="16" ry="7" fill="#aeb5bd"/>
      <ellipse cx="21" cy="-100" rx="12" ry="5" fill="#d7dce1"/>
    </g>
  </g>

  <!-- termo -->
  <g transform="translate(600,150)">
    <ellipse cx="52" cy="252" rx="66" ry="18" fill="#000" opacity="0.18"/>
    <rect x="4"  y="46"  width="96" height="204" rx="16" fill="url(#termo)"/>
    <rect x="10" y="24"  width="84" height="30"  rx="10" fill="#13372a"/>
    <rect x="24" y="0"   width="56" height="30"  rx="10" fill="#1d4a39"/>
    <rect x="4"  y="104" width="96" height="62"  fill="#ece3d1"/>
    <rect x="4"  y="104" width="96" height="10"  fill="#cbbfa6"/>
    <rect x="4"  y="156" width="96" height="10"  fill="#cbbfa6"/>
    <g fill="#2b6a51" opacity="0.55">
      <rect x="20" y="122" width="64" height="8" rx="4"/>
      <rect x="20" y="138" width="44" height="8" rx="4"/>
    </g>
    <rect x="10" y="60" width="14" height="180" rx="7" fill="#ffffff" opacity="0.18"/>
    <rect x="4"  y="236" width="96" height="14" rx="6" fill="#12352a"/>
