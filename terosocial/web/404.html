<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · TeroSocial</title>
<link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --oscuro:#2b3138; --azul:#4f7d9c; --azul-osc:#3f6a86; --azul-suave:#8fb0c4;
    --crema:#e4e0d6; --gris-fondo:#eef1f5; --borde:#cbc6ba; --tinta:#16202c; --gris:#62707f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--gris-fondo);color:var(--tinta);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  .barra{background:var(--oscuro);min-height:54px;display:flex;align-items:center;padding:0 22px}
  .logo{display:flex;align-items:center;gap:9px;color:var(--crema);font-size:16.5px;font-weight:700;letter-spacing:-.02em;text-decoration:none}
  .logo i{font-style:normal;font-weight:400;color:var(--azul-suave)}
  .logo-disco{width:27px;height:27px;border-radius:7px;background:var(--azul);display:flex;align-items:center;justify-content:center}
  .logo-disco span{width:11px;height:11px;border-radius:50%;background:#e4e0d6}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 18px}
  .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:8px;max-width:460px;width:100%;
    padding:38px 30px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .tero{width:120px;height:120px;margin:0 auto 6px;opacity:.85}
  .cod{font-size:13px;letter-spacing:.14em;color:var(--gris);text-transform:uppercase;margin:0 0 4px}
  h1{font-size:21px;margin:0 0 12px;color:var(--tinta)}
  p{font-size:14.5px;line-height:1.6;color:var(--gris);margin:0 0 22px}
  .boton{display:inline-block;background:var(--azul);border:1px solid var(--azul);color:#fff;
    padding:9px 20px;border-radius:6px;font-size:14px;text-decoration:none}
  .boton:hover{background:var(--azul-osc);border-color:var(--azul-osc)}
  .pie{font-size:12px;color:var(--gris);margin-top:26px}
</style>
</head>
<body>
<header class="barra">
  <a class="logo" href="/index.html"><span class="logo-disco"><span></span></span><b>tero</b><i>social</i></a>
</header>

<main>
  <div class="tarjeta">
    <svg class="tero" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke="#8fb0c4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="52" cy="60" rx="31" ry="20"/>
        <circle cx="80" cy="45" r="12"/>
        <path d="M91 42 l17 -5"/>
        <path d="M82 33 l5 -13"/>
        <path d="M44 79 l0 17 M60 79 l0 17"/>
        <path d="M22 62 l-9 4 M23 66 l-8 3"/>
      </g>
      <circle cx="83" cy="43" r="2.3" fill="#8fb0c4"/>
    </svg>
    <p class="cod">Error 404</p>
    <h1>Esta página no está por acá</h1>
    <p>El tero gritó, pero no hay nido en esta dirección. Capaz la escribiste mal,
       o el contenido se dio de baja. Volvé al muro y seguí desde ahí.</p>
    <a class="boton" href="/index.html">Volver al inicio</a>
    <div class="pie">TeroSocial · desde 2018 · Motor 3.0</div>
  </div>
</main>
</body>
</html>
