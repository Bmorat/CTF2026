<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>samsung</Make>
      <Model>SM-A346M</Model>
      <Software>Camara 12.0.3</Software>
      <DateTimeOriginal>2026:05:03 16:27:09</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/250</ExposureTime>
      <FNumber>1.8</FNumber>
      <ISOSpeedRatings>64</ISOSpeedRatings>
      <FocalLength>5.4 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Perro de barrio sentado</title>
  <desc>Ilustracion plana de un perro mestizo marron claro sentado en un patio, mirando de frente a la camara, con paredes calidas de fondo.</desc>

  <defs>
    <linearGradient id="paredp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0d9b4"/>
      <stop offset="65%"  stop-color="#dfbb8c"/>
      <stop offset="100%" stop-color="#c99f6d"/>
    </linearGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b09274"/>
      <stop offset="100%" stop-color="#8d7157"/>
    </linearGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c98d4e"/>
      <stop offset="100%" stop-color="#9c6531"/>
    </linearGradient>
    <radialGradient id="solpared" cx="70%" cy="15%" r="65%">
      <stop offset="0%"   stop-color="#fff2d6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff2d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="500" fill="url(#paredp)"/>
  <rect width="900" height="500" fill="url(#solpared)"/>

  <!-- zocalo y piso -->
  <rect x="0" y="300" width="900" height="26" fill="#a8834f"/>
  <rect x="0" y="326" width="900" height="174" fill="url(#piso)"/>
  <g stroke="#7d6146" stroke-width="3" opacity="0.5">
    <line x1="0" y1="386" x2="900" y2="386"/>
    <line x1="0" y1="448" x2="900" y2="448"/>
    <line x1="200" y1="326" x2="200" y2="500"/>
    <line x1="470" y1="326" x2="470" y2="500"/>
    <line x1="720" y1="326" x2="720" y2="500"/>
  </g>

  <!-- planta en maceta al fondo -->
  <g transform="translate(770,214)">
    <ellipse cx="18" cy="112" rx="52" ry="12" fill="#000" opacity="0.15"/>
    <g fill="#4e7a3c">
      <ellipse cx="18" cy="18" rx="46" ry="34"/>
      <ellipse cx="-10" cy="42" rx="30" ry="22"/>
      <ellipse cx="46" cy="44" rx="28" ry="20"/>
    </g>
    <path d="M-18 62 L54 62 L44 110 L-8 110 Z" fill="#b5643c"/>
    <rect x="-22" y="56" width="82" height="14" rx="4" fill="#c9744a"/>
  </g>

  <!-- sombra del perro -->
  <ellipse cx="430" cy="452" rx="180" ry="30" fill="#000" opacity="0.2"/>

  <!-- cola -->
  <path d="M300 430 q-88 6 -102 -44 q30 42 100 20 z" fill="#a56c34"/>

  <!-- cuerpo -->
  <path d="M348 452 q6 -150 82 -176 q76 26 82 176 z" fill="url(#pelo)"/>
  <path d="M394 452 q-4 -96 36 -128 q40 32 36 128 z" fill="#f0dcbe"/>

  <!-- patas delanteras -->
  <g fill="#c98d4e" stroke="#8b5828" stroke-width="3">
    <path d="M356 452 q0 -60 26 -60 q24 0 24 60 z"/>
    <path d="M454 452 q0 -60 26 -60 q24 0 24 60 z"/>
  </g>
  <g fill="#e9d3b0">
    <ellipse cx="382" cy="450" rx="30" ry="14"/>
    <ellipse cx="480" cy="450" rx="30" ry="14"/>
  </g>

  <!-- cabeza -->
  <g transform="translate(430,222)">
    <!-- orejas -->
    <path d="M-72 -34 q-46 6 -50 66 q-4 52 34 62 q-14 -66 16 -114 z" fill="#8f5a28"/>
    <path d="M72 -34 q46 6 50 66 q4 52 -34 62 q14 -66 -16 -114 z" fill="#8f5a28"/>
    <!-- craneo -->
    <ellipse cx="0" cy="6" rx="82" ry="72" fill="url(#pelo)"/>
    <path d="M-30 -60 q30 -14 60 4 q-14 34 -34 40 q-26 -14 -26 -44 z" fill="#e5cba4" opacity="0.55"/>
    <!-- hocico -->
    <ellipse cx="0" cy="62" rx="48" ry="38" fill="#e9d3b0"/>
    <ellipse cx="0" cy="44" rx="20" ry="14" fill="#3a2a20"/>
    <path d="M0 56 L0 74 M0 74 q-16 14 -26 2 M0 74 q16 14 26 2" stroke="#3a2a20" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- ojos -->
    <ellipse cx="-34" cy="-2" rx="14" ry="15" fill="#2c1d13"/>
    <ellipse cx="34"  cy="-2" rx="14" ry="15" fill="#2c1d13"/>
    <circle cx="-29" cy="-8" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="39"  cy="-8" r="5" fill="#ffffff" opacity="0.9"/>
    <g fill="#7a4c22" opacity="0.6">
      <ellipse cx="-34" cy="-24" rx="18" ry="6"/>
      <ellipse cx="34"  cy="-24" rx="18" ry="6"/>
    </g>
  </g>

  <!-- collar -->
  <path d="M368 302 q62 34 124 0 l0 22 q-62 34 -124 0 z" fill="#b8452f"/>
  <circle cx="430" cy="332" r="12" fill="#e0b64c"/>

</svg>
