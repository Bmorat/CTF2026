<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>Xiaomi</Make>
      <Model>Redmi 12C</Model>
      <Software>MIUI Camara 4.9.7</Software>
      <DateTimeOriginal>2026:05:29 10:41:22</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/500</ExposureTime>
      <FNumber>2.2</FNumber>
      <ISOSpeedRatings>100</ISOSpeedRatings>
      <FocalLength>4.7 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Auto chico usado estacionado en la calle</title>
  <desc>Ilustracion plana de un auto compacto usado color rojo apagado, visto de perfil, estacionado junto al cordon de una calle de barrio.</desc>

  <defs>
    <linearGradient id="cieloa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7cb0d8"/>
      <stop offset="70%"  stop-color="#cfe0e8"/>
      <stop offset="100%" stop-color="#e9e2d2"/>
    </linearGradient>
    <linearGradient id="calle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6d6a66"/>
      <stop offset="100%" stop-color="#46433f"/>
    </linearGradient>
    <linearGradient id="chapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c9553c"/>
      <stop offset="55%"  stop-color="#a63d28"/>
      <stop offset="100%" stop-color="#7c2b1b"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cfe4ee"/>
      <stop offset="100%" stop-color="#8fa9b8"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#cieloa)"/>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="180" cy="60"  rx="110" ry="16"/>
    <ellipse cx="700" cy="80"  rx="130" ry="14"/>
  </g>

  <!-- casas de fondo -->
  <g>
    <rect x="0"   y="150" width="230" height="130" fill="#d9c39c"/>
    <rect x="230" y="176" width="200" height="104" fill="#c9ae86"/>
    <rect x="430" y="140" width="240" height="140" fill="#e0cba4"/>
    <rect x="670" y="182" width="230" height="98"  fill="#cbb590"/>
    <g fill="#8f7550">
      <rect x="0"   y="142" width="230" height="14"/>
      <rect x="230" y="168" width="200" height="14"/>
      <rect x="430" y="132" width="240" height="14"/>
      <rect x="670" y="174" width="230" height="14"/>
    </g>
    <g fill="#6e7f8c">
      <rect x="40"  y="186" width="46" height="42" rx="4"/>
      <rect x="140" y="186" width="46" height="42" rx="4"/>
      <rect x="280" y="206" width="42" height="38" rx="4"/>
      <rect x="480" y="176" width="50" height="44" rx="4"/>
      <rect x="580" y="176" width="50" height="44" rx="4"/>
      <rect x="740" y="212" width="46" height="38" rx="4"/>
      <rect x="830" y="212" width="46" height="38" rx="4"/>
    </g>
  </g>

  <!-- vereda y cordon -->
  <rect x="0" y="280" width="900" height="46" fill="#b8ac97"/>
  <g stroke="#9b9080" stroke-width="3">
    <line x1="0" y1="304" x2="900" y2="304"/>
    <line x1="160" y1="280" x2="160" y2="326"/>
    <line x1="420" y1="280" x2="420" y2="326"/>
    <line x1="690" y1="280" x2="690" y2="326"/>
  </g>
  <rect x="0" y="326" width="900" height="18" fill="#ded6c4"/>
  <rect x="0" y="344" width="900" height="156" fill="url(#calle)"/>
  <g fill="#e8e2d2" opacity="0.75">
    <rect x="60"  y="470" width="90" height="9" rx="4"/>
    <rect x="260" y="470" width="90" height="9" rx="4"/>
    <rect x="460" y="470" width="90" height="9" rx="4"/>
    <rect x="660" y="470" width="90" height="9" rx="4"/>
  </g>

  <!-- arbolito lejano -->
  <g transform="translate(806,196)">
    <rect x="-7" y="40" width="16" height="86" fill="#6b4d31"/>
    <ellipse cx="0" cy="20" rx="52" ry="42" fill="#4f7a3f"/>
    <ellipse cx="-26" cy="42" rx="30" ry="22" fill="#436b36"/>
  </g>

  <!-- sombra del auto -->
  <ellipse cx="450" cy="428" rx="290" ry="24" fill="#000" opacity="0.28"/>

  <!-- auto -->
  <g>
    <!-- carroceria -->
    <path d="M180 412 L176 344 q4 -26 44 -30 l64 -6 q46 -54 116 -58 q86 -6 132 12 q34 12 62 48 l84 14 q40 8 42 34 l2 36 q-2 12 -18 12 L196 424 q-16 0 -16 -12 z" fill="url(#chapa)"/>
    <!-- linea inferior mas oscura -->
    <path d="M180 392 L722 386 l0 26 q-2 12 -18 12 L196 424 q-16 0 -16 -12 z" fill="#7a2a19" opacity="0.7"/>
    <!-- ventanas -->
    <path d="M300 306 q44 -42 96 -44 l0 52 -104 2 q0 -6 8 -10 z" fill="url(#vidrio)"/>
    <path d="M414 262 q66 -2 106 12 q26 10 42 42 l-148 4 z" fill="url(#vidrio)"/>
    <rect x="396" y="258" width="12" height="60" fill="#8d3625"/>
    <!-- puertas -->
    <g stroke="#6f2617" stroke-width="4" opacity="0.8" fill="none">
      <path d="M400 322 L400 400"/>
      <path d="M550 320 L556 392"/>
    </g>
    <g fill="#e6d9c4">
      <rect x="350" y="336" width="42" height="10" rx="5"/>
      <rect x="500" y="334" width="42" height="10" rx="5"/>
    </g>
    <!-- espejo -->
    <path d="M292 306 l-30 6 6 18 26 -8 z" fill="#8d3625"/>
    <!-- luces -->
    <path d="M186 350 q22 -8 40 0 l0 24 -40 2 z" fill="#f2e2b4"/>
    <path d="M714 348 q24 -6 40 6 l0 22 -42 2 z" fill="#c9463a"/>
    <!-- paragolpes -->
    <rect x="172" y="386" width="60" height="22" rx="8" fill="#4c4a48"/>
    <rect x="678" y="386" width="80" height="22" rx="8" fill="#4c4a48"/>
    <!-- oxido y detalles de auto usado -->
    <g fill="#6b4c33" opacity="0.55">
      <ellipse cx="242" cy="404" rx="30" ry="10"/>
      <ellipse cx="640" cy="404" rx="36" ry="9"/>
      <ellipse cx="470" cy="410" rx="24" ry="7"/>
    </g>
    <!-- patente en blanco -->
    <rect x="700" y="392" width="52" height="20" rx="4" fill="#e4dfd2" stroke="#8a8578" stroke-width="3"/>
  </g>

  <!-- ruedas -->
  <g>
    <circle cx="286" cy="412" r="54" fill="#232120"/>
    <circle cx="286" cy="412" r="28" fill="#a9a49a"/>
    <circle cx="286" cy="412" r="11" fill="#6d685f"/>
    <circle cx="646" cy="412" r="54" fill="#232120"/>
    <circle cx="646" cy="412" r="28" fill="#a9a49a"/>
    <circle cx="646" cy="412" r="11" fill="#6d685f"/>
  </g>
  <g stroke="#6d685f" stroke-width="5">
    <line x1="286" y1="388" x2="286" y2="436"/>
    <line x1="262" y1="412" x2="310" y2="412"/>
    <line x1="646" y1="388" x2="646" y2="436"/>
    <line x1="622" y1="412" x2="670" y2="412"/>
  </g>

</svg>
