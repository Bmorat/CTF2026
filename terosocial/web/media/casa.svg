<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>samsung</Make>
      <Model>SM-A245M</Model>
      <Software>Camara 12.1.0</Software>
      <DateTimeOriginal>2026:03:30 17:14:06</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/320</ExposureTime>
      <FNumber>1.8</FNumber>
      <ISOSpeedRatings>80</ISOSpeedRatings>
      <FocalLength>5.2 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Fachada de casa de barrio</title>
  <desc>Ilustracion plana de la fachada de una casa de barrio con reja al frente, ventana enrejada, vereda de baldosas y un arbol al costado.</desc>

  <defs>
    <linearGradient id="cielocasa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6ea6d4"/>
      <stop offset="60%"  stop-color="#bcd7e6"/>
      <stop offset="100%" stop-color="#ecdfc4"/>
    </linearGradient>
    <linearGradient id="fachada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0dcb6"/>
      <stop offset="70%"  stop-color="#dcc294"/>
      <stop offset="100%" stop-color="#c2a173"/>
    </linearGradient>
    <linearGradient id="baldosa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c1b7a4"/>
      <stop offset="100%" stop-color="#9c9280"/>
    </linearGradient>
    <linearGradient id="copa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#639148"/>
      <stop offset="100%" stop-color="#3f6a33"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#cielocasa)"/>
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="150" cy="54" rx="100" ry="16"/>
    <ellipse cx="212" cy="42" rx="58"  ry="11"/>
    <ellipse cx="720" cy="70" rx="120" ry="14"/>
  </g>

  <!-- casa vecina apenas visible -->
  <rect x="0" y="150" width="120" height="200" fill="#c9b48f"/>
  <rect x="0" y="140" width="120" height="16" fill="#8d7a56"/>

  <!-- cuerpo de la casa -->
  <rect x="110" y="130" width="600" height="230" fill="url(#fachada)"/>
  <!-- parapeto / cornisa -->
  <rect x="96"  y="106" width="628" height="30" rx="4" fill="#c39a63"/>
  <rect x="96"  y="136" width="628" height="12" fill="#a97f4c"/>
  <!-- techo de chapa lateral -->
  <path d="M710 130 L830 168 L830 360 L710 360 Z" fill="#c2a173"/>
  <path d="M700 124 L840 168 L840 182 L700 140 Z" fill="#8f6a44"/>

  <!-- zocalo -->
  <rect x="110" y="326" width="720" height="34" fill="#8d6a45"/>

  <!-- puerta -->
  <rect x="188" y="184" width="110" height="146" rx="4" fill="#6b3f22"/>
  <rect x="200" y="196" width="86"  height="60" rx="3" fill="#7d4d2c"/>
  <rect x="200" y="264" width="86"  height="56" rx="3" fill="#7d4d2c"/>
  <circle cx="282" cy="262" r="7" fill="#e0b64c"/>
  <rect x="176" y="176" width="134" height="14" rx="4" fill="#a97f4c"/>

  <!-- ventana con reja -->
  <rect x="384" y="180" width="230" height="130" rx="4" fill="#3f5a68"/>
  <rect x="396" y="192" width="206" height="106" fill="#7fa5b8"/>
  <rect x="494" y="192" width="12"  height="106" fill="#e2dccd"/>
  <rect x="396" y="240" width="206" height="10"  fill="#e2dccd"/>
  <rect x="372" y="168" width="254" height="16" rx="4" fill="#a97f4c"/>
  <g fill="#4a453f">
    <rect x="404" y="184" width="9" height="120"/>
    <rect x="440" y="184" width="9" height="120"/>
    <rect x="476" y="184" width="9" height="120"/>
    <rect x="512" y="184" width="9" height="120"/>
    <rect x="548" y="184" width="9" height="120"/>
    <rect x="584" y="184" width="9" height="120"/>
    <rect x="384" y="212" width="230" height="9"/>
    <rect x="384" y="270" width="230" height="9"/>
  </g>

  <!-- numero de puerta neutro -->
  <rect x="322" y="212" width="34" height="24" rx="4" fill="#e6dfd0" stroke="#9c907c" stroke-width="3"/>

  <!-- vereda -->
  <rect x="0" y="360" width="900" height="140" fill="url(#baldosa)"/>
  <g stroke="#877e6d" stroke-width="3" opacity="0.8">
    <line x1="0" y1="404" x2="900" y2="404"/>
    <line x1="0" y1="452" x2="900" y2="452"/>
    <line x1="120" y1="360" x2="120" y2="500"/>
    <line x1="300" y1="360" x2="300" y2="500"/>
    <line x1="480" y1="360" x2="480" y2="500"/>
    <line x1="660" y1="360" x2="660" y2="500"/>
    <line x1="840" y1="360" x2="840" y2="500"/>
  </g>

  <!-- reja del frente -->
  <g>
    <rect x="96" y="300" width="640" height="12" rx="4" fill="#3d4a52"/>
    <rect x="96" y="368" width="640" height="12" rx="4" fill="#3d4a52"/>
    <g fill="#4c5a63">
      <rect x="104" y="284" width="12" height="110" rx="3"/>
      <rect x="152" y="284" width="12" height="110" rx="3"/>
      <rect x="200" y="284" width="12" height="110" rx="3"/>
      <rect x="248" y="284" width="12" height="110" rx="3"/>
      <rect x="296" y="284" width="12" height="110" rx="3"/>
      <rect x="344" y="284" width="12" height="110" rx="3"/>
      <rect x="392" y="284" width="12" height="110" rx="3"/>
      <rect x="440" y="284" width="12" height="110" rx="3"/>
      <rect x="488" y="284" width="12" height="110" rx="3"/>
      <rect x="536" y="284" width="12" height="110" rx="3"/>
      <rect x="584" y="284" width="12" height="110" rx="3"/>
      <rect x="632" y="284" width="12" height="110" rx="3"/>
      <rect x="680" y="284" width="12" height="110" rx="3"/>
      <rect x="722" y="284" width="14" height="110" rx="3"/>
    </g>
    <rect x="190" y="272" width="130" height="16" rx="5" fill="#2f3a41"/>
    <circle cx="330" cy="340" r="10" fill="#c9a24a"/>
  </g>

  <!-- macetas -->
  <g transform="translate(640,318)">
    <ellipse cx="24" cy="72" rx="42" ry="10" fill="#000" opacity="0.16"/>
    <g fill="#4f7a3c">
      <ellipse cx="24" cy="10" rx="38" ry="26"/>
      <ellipse cx="0"  cy="30" rx="24" ry="18"/>
      <ellipse cx="48" cy="30" rx="22" ry="16"/>
    </g>
    <path d="M-6 40 L54 40 L46 72 L2 72 Z" fill="#b5643c"/>
    <rect x="-10" y="34" width="68" height="12" rx="4" fill="#c9744a"/>
  </g>

  <!-- arbol de la vereda -->
  <g transform="translate(818,150)">
    <ellipse cx="0" cy="286" rx="76" ry="18" fill="#000" opacity="0.2"/>
    <rect x="-16" y="130" width="34" height="156" rx="6" fill="#6b4a2c"/>
    <path d="M-14 200 q-34 -20 -46 -50 q34 18 46 34 z" fill="#5c3f25"/>
    <ellipse cx="0"   cy="86"  rx="96" ry="72" fill="url(#copa)"/>
    <ellipse cx="-58" cy="126" rx="52" ry="38" fill="#4b7639"/>
    <ellipse cx="54"  cy="122" rx="48" ry="34" fill="#57853f"/>
    <ellipse cx="-20" cy="46"  rx="48" ry="30" fill="#6d9b4c" opacity="0.75"/>
  </g>

</svg>
