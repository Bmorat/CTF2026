<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>samsung</Make>
      <Model>SM-S911B</Model>
      <Software>Camara 13.1.02</Software>
      <DateTimeOriginal>2026:02:07 15:52:30</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/1000</ExposureTime>
      <FNumber>1.7</FNumber>
      <ISOSpeedRatings>50</ISOSpeedRatings>
      <FocalLength>6.3 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Ruta recta hacia el horizonte</title>
  <desc>Ilustracion plana de una ruta asfaltada recta con lineas blancas que se pierden en el horizonte, un camion a lo lejos y campo abierto a ambos lados.</desc>

  <defs>
    <linearGradient id="cielor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5e9ccc"/>
      <stop offset="50%"  stop-color="#a9cde3"/>
      <stop offset="82%"  stop-color="#ded7c0"/>
      <stop offset="100%" stop-color="#f0e0bd"/>
    </linearGradient>
    <linearGradient id="pasto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9aa85c"/>
      <stop offset="35%"  stop-color="#86994c"/>
      <stop offset="100%" stop-color="#5f7738"/>
    </linearGradient>
    <linearGradient id="asfalto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6f6c6a"/>
      <stop offset="45%"  stop-color="#57534f"/>
      <stop offset="100%" stop-color="#3d3a37"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#cielor)"/>
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="160" cy="70"  rx="110" ry="20"/>
    <ellipse cx="230" cy="54"  rx="66"  ry="14"/>
    <ellipse cx="660" cy="96"  rx="130" ry="18"/>
    <ellipse cx="740" cy="80"  rx="70"  ry="13"/>
    <ellipse cx="430" cy="132" rx="90"  ry="12"/>
  </g>

  <!-- campo -->
  <rect x="0" y="212" width="900" height="288" fill="url(#pasto)"/>
  <path d="M0 212 q150 -14 300 -4 q220 14 600 -6 l0 20 L0 232 Z" fill="#7d9146"/>
  <g fill="#6b8340" opacity="0.7">
    <ellipse cx="120" cy="268" rx="140" ry="18"/>
    <ellipse cx="760" cy="292" rx="170" ry="22"/>
    <ellipse cx="330" cy="360" rx="200" ry="26"/>
  </g>
  <g fill="#4e6b32">
    <ellipse cx="70"  cy="204" rx="42" ry="24"/>
    <ellipse cx="112" cy="208" rx="28" ry="16"/>
    <ellipse cx="806" cy="202" rx="48" ry="26"/>
    <ellipse cx="852" cy="208" rx="30" ry="16"/>
    <ellipse cx="248" cy="206" rx="26" ry="14"/>
  </g>

  <!-- ruta -->
  <path d="M96 500 L424 214 L476 214 L824 500 Z" fill="url(#asfalto)"/>
  <path d="M96 500 L424 214 L432 214 L152 500 Z" fill="#e8e3d6"/>
  <path d="M824 500 L476 214 L468 214 L768 500 Z" fill="#e8e3d6"/>

  <!-- lineas blancas centrales -->
  <g fill="#f3efe2">
    <path d="M446 218 L454 218 L455 232 L445 232 Z"/>
    <path d="M444 244 L456 244 L458 264 L442 264 Z"/>
    <path d="M441 278 L459 278 L462 304 L438 304 Z"/>
    <path d="M436 320 L464 320 L468 354 L432 354 Z"/>
    <path d="M429 372 L471 372 L477 416 L423 416 Z"/>
    <path d="M419 436 L481 436 L489 496 L411 496 Z"/>
  </g>

  <!-- banquina -->
  <path d="M60 500 L418 212 L424 212 L96 500 Z" fill="#a08e63" opacity="0.7"/>
  <path d="M858 500 L482 212 L476 212 L822 500 Z" fill="#a08e63" opacity="0.7"/>

  <!-- alambrado izquierdo -->
  <g stroke="#6d573c" stroke-width="6">
    <line x1="8"   y1="266" x2="8"   y2="350"/>
    <line x1="128" y1="252" x2="128" y2="322"/>
    <line x1="238" y1="240" x2="238" y2="296"/>
    <line x1="320" y1="232" x2="320" y2="276"/>
  </g>
  <g stroke="#7f6b4e" stroke-width="3" fill="none">
    <path d="M0 282 L360 232"/>
    <path d="M0 312 L360 246"/>
  </g>
  <g stroke="#6d573c" stroke-width="6">
    <line x1="892" y1="262" x2="892" y2="348"/>
    <line x1="772" y1="248" x2="772" y2="318"/>
    <line x1="664" y1="238" x2="664" y2="294"/>
    <line x1="580" y1="230" x2="580" y2="274"/>
  </g>
  <g stroke="#7f6b4e" stroke-width="3" fill="none">
    <path d="M900 278 L540 230"/>
    <path d="M900 308 L540 244"/>
  </g>

  <!-- camion a lo lejos -->
  <g transform="translate(430,182)">
    <rect x="0"  y="6"  width="40" height="24" rx="3" fill="#d8d2c4"/>
    <rect x="38" y="12" width="18" height="18" rx="3" fill="#b23f2c"/>
    <rect x="40" y="15" width="12" height="8"  rx="2" fill="#8ab4cf"/>
    <rect x="0"  y="30" width="56" height="5"  fill="#3a3733"/>
    <g fill="#2b2926">
      <circle cx="10" cy="34" r="4"/>
      <circle cx="30" cy="34" r="4"/>
      <circle cx="48" cy="34" r="4"/>
    </g>
  </g>

  <!-- cartel de banquina -->
  <g transform="translate(694,300)">
    <rect x="0" y="0" width="12" height="86" fill="#8a7c66"/>
    <rect x="-32" y="-46" width="76" height="52" rx="6" fill="#3f6b47" stroke="#e6e0cf" stroke-width="4"/>
    <rect x="-20" y="-32" width="52" height="8" rx="4" fill="#e6e0cf" opacity="0.9"/>
    <rect x="-20" y="-16" width="34" height="8" rx="4" fill="#e6e0cf" opacity="0.7"/>
  </g>

</svg>
