<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">

  <metadata id="bloque-camara">
    <camara>
      <Make>motorola</Make>
      <Model>moto g54</Model>
      <Software>Camara 8.3.9</Software>
      <DateTimeOriginal>2026:02:14 20:36:41</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/30</ExposureTime>
      <FNumber>1.8</FNumber>
      <ISOSpeedRatings>1250</ISOSpeedRatings>
      <FocalLength>4.5 mm</FocalLength>
      <Flash>no disparado</Flash>
    </camara>
  </metadata>

  <title>Tambores de candombe junto a la fogata</title>
  <desc>Ilustracion plana de tres tambores de candombe, chico, repique y piano, apoyados en la vereda junto a una fogata para templar los cueros al atardecer.</desc>

  <defs>
    <linearGradient id="tarde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2b3350"/>
      <stop offset="45%"  stop-color="#6b4f63"/>
      <stop offset="78%"  stop-color="#c2724a"/>
      <stop offset="100%" stop-color="#e5a05c"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5d4a3c"/>
      <stop offset="100%" stop-color="#3a2d24"/>
    </linearGradient>
    <linearGradient id="duela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5e3a20"/>
      <stop offset="38%"  stop-color="#9c6334"/>
      <stop offset="72%"  stop-color="#7a4a26"/>
      <stop offset="100%" stop-color="#4a2c16"/>
    </linearGradient>
    <linearGradient id="cuero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0dcb4"/>
      <stop offset="100%" stop-color="#cdb287"/>
    </linearGradient>
    <radialGradient id="fuegoluz" cx="50%" cy="60%" r="50%">
      <stop offset="0%"   stop-color="#ffb64a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffb64a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="500" fill="url(#tarde)"/>
  <g fill="#ffffff" opacity="0.14">
    <ellipse cx="220" cy="86"  rx="130" ry="18"/>
    <ellipse cx="690" cy="120" rx="150" ry="16"/>
  </g>

  <!-- muro del fondo -->
  <rect x="0" y="216" width="900" height="120" fill="#4a3a44"/>
  <g fill="#5c4854" opacity="0.8">
    <rect x="30"  y="240" width="150" height="70" rx="6"/>
    <rect x="220" y="232" width="180" height="78" rx="6"/>
    <rect x="440" y="244" width="140" height="66" rx="6"/>
    <rect x="620" y="228" width="200" height="82" rx="6"/>
  </g>
  <g fill="#f0c169" opacity="0.55">
    <rect x="70"  y="258" width="26" height="20"/>
    <rect x="268" y="252" width="26" height="20"/>
    <rect x="672" y="248" width="26" height="20"/>
  </g>

  <!-- suelo -->
  <rect x="0" y="336" width="900" height="164" fill="url(#suelo)"/>
  <rect x="0" y="336" width="900" height="12" fill="#75604e"/>
  <g stroke="#2e241d" stroke-width="3" opacity="0.7">
    <line x1="0" y1="404" x2="900" y2="404"/>
    <line x1="230" y1="348" x2="230" y2="500"/>
    <line x1="560" y1="348" x2="560" y2="500"/>
    <line x1="820" y1="348" x2="820" y2="500"/>
  </g>

  <!-- resplandor de la fogata -->
  <ellipse cx="720" cy="380" rx="290" ry="180" fill="url(#fuegoluz)"/>

  <!-- fogata -->
  <g transform="translate(720,336)">
    <ellipse cx="0" cy="86" rx="120" ry="26" fill="#000" opacity="0.25"/>
    <g stroke="#4a3423" stroke-width="14" stroke-linecap="round">
      <line x1="-70" y1="80" x2="46"  y2="56"/>
      <line x1="66"  y1="80" x2="-40" y2="54"/>
      <line x1="-56" y1="60" x2="52"  y2="82"/>
    </g>
    <path d="M-46 62 q10 -66 22 -84 q6 34 26 44 q14 -18 12 -40 q34 42 30 80 q-4 34 -44 36 q-44 2 -46 -36 z" fill="#e8551f"/>
    <path d="M-26 62 q6 -46 16 -60 q6 24 20 30 q8 -12 8 -26 q22 30 18 56 q-2 24 -30 26 q-32 2 -32 -26 z" fill="#f6913a"/>
    <path d="M-10 62 q4 -30 10 -40 q10 20 12 40 q0 14 -12 14 q-12 0 -10 -14 z" fill="#ffdd7c"/>
    <g fill="#ffce6a" opacity="0.85">
      <circle cx="-72" cy="-30" r="5"/>
      <circle cx="58"  cy="-56" r="4"/>
      <circle cx="12"  cy="-96" r="5"/>
      <circle cx="-38" cy="-78" r="4"/>
      <circle cx="86"  cy="-14" r="4"/>
    </g>
  </g>

  <!-- tambor piano (grande) -->
  <g transform="translate(210,196)">
    <ellipse cx="0" cy="230" rx="98" ry="22" fill="#000" opacity="0.3"/>
    <path d="M-70 26 q70 -20 140 0 l-18 200 q-52 16 -104 0 z" fill="url(#duela)"/>
    <ellipse cx="0" cy="26" rx="70" ry="20" fill="#8a5c35"/>
    <ellipse cx="0" cy="24" rx="64" ry="17" fill="url(#cuero)"/>
    <ellipse cx="0" cy="24" rx="64" ry="17" fill="none" stroke="#6b4726" stroke-width="6"/>
    <g fill="#d7b476" opacity="0.85">
      <rect x="-72" y="52"  width="144" height="12" rx="6"/>
      <rect x="-66" y="150" width="132" height="12" rx="6"/>
    </g>
    <g fill="#3c2614">
      <circle cx="-56" cy="80" r="6"/>
      <circle cx="-18" cy="76" r="6"/>
      <circle cx="20"  cy="76" r="6"/>
      <circle cx="56"  cy="80" r="6"/>
    </g>
    <path d="M-64 100 q64 26 128 0" stroke="#c8523a" stroke-width="12" fill="none" opacity="0.9"/>
  </g>

  <!-- tambor repique (medio) -->
  <g transform="translate(380,238)">
    <ellipse cx="0" cy="196" rx="78" ry="18" fill="#000" opacity="0.28"/>
    <path d="M-56 22 q56 -16 112 0 l-14 170 q-42 14 -84 0 z" fill="url(#duela)"/>
    <ellipse cx="0" cy="22" rx="56" ry="16" fill="#8a5c35"/>
    <ellipse cx="0" cy="20" rx="50" ry="13" fill="url(#cuero)"/>
    <ellipse cx="0" cy="20" rx="50" ry="13" fill="none" stroke="#6b4726" stroke-width="5"/>
    <g fill="#d7b476" opacity="0.85">
      <rect x="-58" y="44"  width="116" height="10" rx="5"/>
      <rect x="-52" y="132" width="104" height="10" rx="5"/>
    </g>
    <g fill="#3c2614">
      <circle cx="-42" cy="70" r="5"/>
      <circle cx="-12" cy="66" r="5"/>
      <circle cx="18"  cy="66" r="5"/>
      <circle cx="46"  cy="70" r="5"/>
    </g>
    <path d="M-50 92 q50 22 100 0" stroke="#2f6f9c" stroke-width="11" fill="none" opacity="0.9"/>
  </g>

  <!-- tambor chico (pequeno) -->
  <g transform="translate(520,278)">
    <ellipse cx="0" cy="162" rx="62" ry="15" fill="#000" opacity="0.26"/>
    <path d="M-44 18 q44 -14 88 0 l-12 140 q-32 12 -64 0 z" fill="url(#duela)"/>
    <ellipse cx="0" cy="18" rx="44" ry="13" fill="#8a5c35"/>
    <ellipse cx="0" cy="16" rx="39" ry="11" fill="url(#cuero)"/>
    <ellipse cx="0" cy="16" rx="39" ry="11" fill="none" stroke="#6b4726" stroke-width="5"/>
    <g fill="#d7b476" opacity="0.85">
      <rect x="-46" y="36"  width="92" height="9" rx="4"/>
      <rect x="-40" y="108" width="80" height="9" rx="4"/>
    </g>
    <g fill="#3c2614">
      <circle cx="-32" cy="58" r="4"/>
      <circle cx="-8"  cy="56" r="4"/>
      <circle cx="16"  cy="56" r="4"/>
      <circle cx="36"  cy="58" r="4"/>
    </g>
    <path d="M-38 76 q38 18 76 0" stroke="#d8a02f" stroke-width="10" fill="none" opacity="0.9"/>
  </g>

  <!-- palos apoyados -->
  <g stroke="#c9a778" stroke-width="9" stroke-linecap="round">
    <line x1="592" y1="452" x2="676" y2="410"/>
    <line x1="596" y1="466" x2="686" y2="428"/>
  </g>

