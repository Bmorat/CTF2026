  </metadata>

  <title>Bicicleta playera apoyada en la pared</title>
  <desc>Ilustracion plana de una bicicleta playera celeste con canasto, vista de perfil, apoyada contra una pared revocada sobre la vereda.</desc>

  <defs>
    <linearGradient id="revoque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0e0c4"/>
      <stop offset="60%"  stop-color="#dcc6a2"/>
      <stop offset="100%" stop-color="#c4a87f"/>
    </linearGradient>
    <linearGradient id="vereda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b5aa99"/>
      <stop offset="100%" stop-color="#948a79"/>
    </linearGradient>
    <linearGradient id="cuadro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6fb3d2"/>
      <stop offset="100%" stop-color="#3d7f9e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#revoque)"/>
