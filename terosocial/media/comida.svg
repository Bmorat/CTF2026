      <Make>Xiaomi</Make>
      <Model>POCO X6 Pro</Model>
      <Software>HyperOS Camara 2.0</Software>
      <DateTimeOriginal>2026:07:12 13:24:51</DateTimeOriginal>
      <OffsetTime>-03:00</OffsetTime>
      <Orientation>1</Orientation>
      <ExposureTime>1/120</ExposureTime>
      <FNumber>1.9</FNumber>
      <ISOSpeedRatings>320</ISOSpeedRatings>
