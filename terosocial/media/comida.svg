  <title>Asado en la parrilla</title>
  <desc>Ilustracion plana de una parrilla vista de cerca con tira de asado y chorizos sobre las barras de hierro, brasas encendidas debajo y humo tenue.</desc>

  <defs>
    <linearGradient id="ladrillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a2f26"/>
      <stop offset="100%" stop-color="#2e1c17"/>
    </linearGradient>
    <linearGradient id="brasas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a2a12"/>
      <stop offset="40%"  stop-color="#d2461a"/>
      <stop offset="75%"  stop-color="#f2851f"/>
      <stop offset="100%" stop-color="#8f3313"/>
    </linearGradient>
    <linearGradient id="carne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a8542f"/>
      <stop offset="55%"  stop-color="#7d3a1e"/>
      <stop offset="100%" stop-color="#5a2714"/>
    </linearGradient>
    <linearGradient id="chori" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c06638"/>
      <stop offset="60%"  stop-color="#96401f"/>
      <stop offset="100%" stop-color="#6d2b13"/>
    </linearGradient>
    <radialGradient id="calor" cx="50%" cy="70%" r="60%">
      <stop offset="0%"   stop-color="#ff9b3d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9b3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="500" fill="url(#ladrillo)"/>

